<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gudang Stok — My Kitchen</title>
<script src="brand-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'brand': (window.BRAND && BRAND.primaryColor) || '#DC2626',
          'brand-hover': (window.BRAND && BRAND.primaryColorHover) || '#B91C1C',
          'brand-cream': (window.BRAND && BRAND.creamColor) || '#FEF2F2',
          'brand-dark': (window.BRAND && BRAND.darkColor) || '#450A0A'
        }
      }
    }
  }
</script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="api-supabase.js?v=20261004d"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&family=Playfair+Display+SC:wght@400;700&family=Space+Mono:wght@400;700&display=swap');
  body {
    font-family: 'Karla', sans-serif;
    background-color: #F8F9FA;
    color: #450A0A;
    -webkit-tap-highlight-color: transparent;
  }
  .font-display { font-family: 'Playfair Display SC', serif; }
  .font-mono-receipt { font-family: 'Space Mono', monospace; }
  .tab-btn.active { background: #450A0A; color: #fff; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #f1f1f1; }
  ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 9999px; }
</style>
</head>
<body class="min-h-screen">

<!-- LOCK SCREEN -->
<div id="lock-screen" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-white rounded-3xl p-8 shadow-xl border border-stone-200 text-center">
    <div class="text-5xl mb-4">📦</div>
    <h1 class="font-display text-2xl font-black text-maroon mb-1">GUDANG STOK</h1>
    <p class="text-xs text-stone-500 mb-6">Pilih outlet untuk mengelola stok</p>
    <select id="lock-outlet-select" class="w-full px-4 py-3 rounded-2xl border-2 border-stone-200 text-sm font-bold focus:border-brand focus:outline-none mb-4">
      <option value="">-- Pilih Outlet --</option>
    </select>
    <button onclick="lockGudang()" class="w-full py-3 rounded-2xl bg-brand hover:bg-branddark text-white font-extrabold text-sm transition-colors">Masuk Gudang</button>
    <p class="text-[10px] text-stone-400 mt-4">Butuh login portal (Owner / Manager) terlebih dahulu</p>
  </div>
</div>

<!-- MAIN -->
<div id="main-screen" class="hidden">
  <!-- HEADER -->
  <header class="bg-white border-b border-stone-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-[1400px] mx-auto px-4 py-4">
      <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-2 shrink-0">
          <img data-brand-logo src="./assets/logo-my-kitchen.svg" alt="My Kitchen" class="h-10 sm:h-11 object-contain">
          <span class="font-display text-2xl text-brand-dark leading-none" data-brand-text="name">My Kitchen</span>
        </a>
        <span class="bg-amber-100 text-amber-900 border border-amber-300 font-extrabold text-xs uppercase tracking-wider px-3 py-1.5 rounded-lg hidden sm:flex items-center gap-1.5">
          <i data-lucide="package" class="w-3.5 h-3.5 text-amber-700"></i>
          <span>Gudang Stok</span>
        </span>
        <span id="gudang-outlet-name" class="text-xs text-stone-500 font-semibold">—</span>
        <div class="ml-auto flex items-center gap-1.5">
          <span id="gudang-user" class="hidden md:block text-xs font-bold bg-stone-100 px-3 py-1.5 rounded-full text-stone-600"></span>
          <button onclick="unlockGudang()" class="p-2 rounded-xl text-stone-400 hover:text-stone-700 hover:bg-stone-100" title="Ganti outlet"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
          <a href="owner.html" class="p-2 rounded-xl text-stone-400 hover:text-stone-700 hover:bg-stone-100" title="Portal Owner"><i data-lucide="home" class="w-4 h-4"></i></a>
        </div>
      </div>
      <!-- TABS -->
      <div class="flex gap-1.5 mt-3 overflow-x-auto pb-1" id="tabs">
        <button onclick="switchTab('dash')" data-tab="dash" class="tab-btn active shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold bg-stone-100 hover:bg-stone-200 text-stone-700 transition-colors">📊 Dasbor</button>
        <button onclick="switchTab('stok')" data-tab="stok" class="tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold bg-stone-100 hover:bg-stone-200 text-stone-700 transition-colors">📦 Stok</button>
        <button onclick="switchTab('po')" data-tab="po" class="tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold bg-stone-100 hover:bg-stone-200 text-stone-700 transition-colors">📥 Terima PO</button>
        <button onclick="switchTab('transfer')" data-tab="transfer" class="tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold bg-stone-100 hover:bg-stone-200 text-stone-700 transition-colors">🔄 Transfer</button>
        <button onclick="switchTab('pasar')" data-tab="pasar" class="tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold bg-stone-100 hover:bg-stone-200 text-stone-700 transition-colors">🛒 Pasar</button>
        <button onclick="switchTab('prep')" data-tab="prep" class="tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold bg-stone-100 hover:bg-stone-200 text-stone-700 transition-colors">🍲 Prep</button>
        <button onclick="switchTab('opname')" data-tab="opname" class="tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold bg-stone-100 hover:bg-stone-200 text-stone-700 transition-colors">📋 Opname</button>
        <button onclick="switchTab('waste')" data-tab="waste" class="tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold bg-stone-100 hover:bg-stone-200 text-stone-700 transition-colors">🗑️ Waste</button>
        <button onclick="switchTab('riwayat')" data-tab="riwayat" class="tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold bg-stone-100 hover:bg-stone-200 text-stone-700 transition-colors">📜 Riwayat</button>
        <button onclick="switchTab('appr')" data-tab="appr" class="tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold bg-stone-100 hover:bg-stone-200 text-stone-700 transition-colors">✅ Approval <span id="appr-badge" class="hidden ml-1 px-1.5 rounded-full bg-amber-400 text-maroon text-[10px]">0</span></button>
      </div>
    </div>
  </header>

  <main class="max-w-[1400px] mx-auto px-4 py-6">
    <!-- DASBOR -->
    <div id="tab-dash" class="tab-panel">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-3xl p-5 border border-stone-200 shadow-xs">
          <div class="text-[11px] font-bold text-stone-400 uppercase">Total Bahan</div>
          <div id="dash-total" class="text-3xl font-black text-maroon font-mono mt-1">—</div>
        </div>
        <div class="bg-white rounded-3xl p-5 border border-stone-200 shadow-xs">
          <div class="text-[11px] font-bold text-stone-400 uppercase">Nilai Persediaan</div>
          <div id="dash-value" class="text-2xl font-black text-maroon font-mono mt-1">—</div>
        </div>
        <div class="bg-white rounded-3xl p-5 border border-amber-200 bg-amber-50/50 shadow-xs">
          <div class="text-[11px] font-bold text-amber-600 uppercase">⚠️ Menipis</div>
          <div id="dash-low" class="text-3xl font-black text-amber-600 font-mono mt-1">—</div>
        </div>
        <div class="bg-white rounded-3xl p-5 border border-rose-200 bg-rose-50/50 shadow-xs">
          <div class="text-[11px] font-bold text-rose-600 uppercase">🚫 Habis</div>
          <div id="dash-out" class="text-3xl font-black text-rose-600 font-mono mt-1">—</div>
        </div>
      </div>
      <div class="bg-white rounded-3xl border border-stone-200 shadow-xs overflow-hidden">
        <div class="p-5 border-b border-stone-100">
          <h3 class="font-extrabold text-maroon">⚠️ Perlu Perhatian</h3>
        </div>
        <div id="dash-alerts" class="divide-y divide-stone-100 max-h-[400px] overflow-y-auto"></div>
      </div>
    </div>

    <!-- STOK -->
    <div id="tab-stok" class="tab-panel hidden">
      <div class="flex flex-col sm:flex-row gap-3 mb-4">
        <input id="stok-search" oninput="renderStok()" placeholder="🔍 Cari bahan..." class="flex-1 px-4 py-2.5 rounded-2xl border border-stone-300 text-sm focus:border-brand focus:outline-none">
        <select id="stok-filter" onchange="renderStok()" class="px-4 py-2.5 rounded-2xl border border-stone-300 text-sm font-bold focus:border-brand focus:outline-none">
          <option value="">Semua</option>
          <option value="low">Menipis</option>
          <option value="out">Habis</option>
          <option value="RAW_MATERIAL">Bahan Mentah</option>
          <option value="PREP_ITEM">Bahan Olahan</option>
          <option value="PACKAGING">Kemasan</option>
        </select>
        <button onclick="openAddIng()" class="px-4 py-2.5 rounded-2xl bg-brand hover:bg-branddark text-white text-sm font-bold">+ Bahan</button>
      </div>
      <div class="bg-white rounded-3xl border border-stone-200 shadow-xs overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-stone-50 text-stone-500 text-[11px] uppercase font-bold border-b">
              <tr><th class="text-left py-3 px-4">Bahan</th><th class="text-right py-3 px-4">Stok</th><th class="text-right py-3 px-4">HPP</th><th class="text-center py-3 px-4">Aksi</th></tr>
            </thead>
            <tbody id="stok-body" class="divide-y divide-stone-100"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TERIMA PO -->
    <div id="tab-po" class="tab-panel hidden">
      <div id="po-list" class="space-y-3"></div>
    </div>

    <!-- TRANSFER -->
    <div id="tab-transfer" class="tab-panel hidden">
      <button onclick="openTransferModal()" class="mb-4 px-4 py-2.5 rounded-2xl bg-brand hover:bg-branddark text-white text-sm font-bold">+ Transfer Baru</button>
      <div id="transfer-list" class="bg-white rounded-3xl border border-stone-200 divide-y divide-stone-100"></div>
    </div>

    <!-- PASAR -->
    <div id="tab-pasar" class="tab-panel hidden">
      <button onclick="openPasarModal()" class="mb-4 px-4 py-2.5 rounded-2xl bg-brand hover:bg-branddark text-white text-sm font-bold">+ Belanja Pasar</button>
      <div id="pasar-list" class="bg-white rounded-3xl border border-stone-200 divide-y divide-stone-100"></div>
    </div>

    <!-- PREP -->
    <div id="tab-prep" class="tab-panel hidden">
      <button onclick="openPrepModal()" class="mb-4 px-4 py-2.5 rounded-2xl bg-brand hover:bg-branddark text-white text-sm font-bold">+ Batch Prep</button>
      <div id="prep-list" class="bg-white rounded-3xl border border-stone-200 divide-y divide-stone-100"></div>
    </div>

    <!-- OPNAME -->
    <div id="tab-opname" class="tab-panel hidden">
      <button onclick="openOpnameModal()" class="mb-4 px-4 py-2.5 rounded-2xl bg-brand hover:bg-branddark text-white text-sm font-bold">+ Opname Baru</button>
      <div id="opname-list" class="space-y-3"></div>
    </div>

    <!-- WASTE -->
    <div id="tab-waste" class="tab-panel hidden">
      <button onclick="openWasteModal()" class="mb-4 px-4 py-2.5 rounded-2xl bg-brand hover:bg-branddark text-white text-sm font-bold">+ Catat Waste</button>
      <div id="waste-list" class="bg-white rounded-3xl border border-stone-200 divide-y divide-stone-100"></div>
    </div>

    <!-- RIWAYAT -->
    <div id="tab-riwayat" class="tab-panel hidden">
      <div class="flex gap-3 mb-4">
        <select id="log-filter" onchange="renderLogs()" class="px-4 py-2.5 rounded-2xl border border-stone-300 text-sm font-bold">
          <option value="">Semua Transaksi</option>
          <option value="IN_RESTOCK">Restock</option>
          <option value="IN_PURCHASE">Terima PO</option>
          <option value="IN_PASAR">Belanja Pasar</option>
          <option value="IN_PREP">Hasil Prep</option>
          <option value="OUT_SALE">Penjualan</option>
          <option value="OUT_WASTE">Waste</option>
          <option value="OUT_PREP">Pakai Prep</option>
          <option value="OPNAME_ADJUSTMENT">Opname</option>
          <option value="IN_TRANSFER">Transfer Masuk</option>
          <option value="OUT_TRANSFER">Transfer Keluar</option>
        </select>
      </div>
      <div id="log-list" class="bg-white rounded-3xl border border-stone-200 divide-y divide-stone-100"></div>
    </div>

    <!-- APPROVAL -->
    <div id="tab-appr" class="tab-panel hidden">
      <div id="appr-list" class="space-y-3"></div>
    </div>
  </main>
</div>

<!-- MODALS -->
<div id="modal-wrap"></div>

<script>
let G = { outlet: null, ingredients: [], logs: [], session: null, outlets: [] };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
const fmtDate = iso => { try { return new Date(iso).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch(e) { return '-'; } };

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-2xl text-sm font-bold text-white shadow-xl ' + (type === 'error' ? 'bg-rose-600' : type === 'warn' ? 'bg-amber-500' : 'bg-emerald-600');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

// ===== INIT =====
async function init() {
  try {
    const s = JSON.parse(sessionStorage.getItem('mykitchen_portal_session') || 'null');
    if (!s || !['owner','area_manager','store_manager'].includes(s.role)) {
      $('lock-screen').innerHTML = '<div class="w-full max-w-sm bg-white rounded-3xl p-8 shadow-xl border text-center"><div class="text-4xl mb-3">🔒</div><p class="font-bold text-maroon mb-2">Butuh login portal</p><p class="text-xs text-stone-500 mb-4">Buka Portal Owner dan login dulu sebagai Owner/Manager.</p><a href="owner.html" class="inline-block px-6 py-3 rounded-2xl bg-brand text-white font-bold text-sm">Ke Portal Owner</a></div>';
      return;
    }
    G.session = s;
    const ro = await (await fetch('/api/outlets')).json();
    G.outlets = ro.outlets || [];
    const allowed = s.role === 'owner' ? G.outlets : G.outlets.filter(o => (s.outletIds || []).includes(o.id));
    $('lock-outlet-select').innerHTML = '<option value="">-- Pilih Outlet --</option>' + allowed.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join('');
    const saved = localStorage.getItem('mykitchen_gudang_outlet_id');
    if (saved && allowed.some(o => o.id === saved)) { $('lock-outlet-select').value = saved; lockGudang(); }
  } catch(e) { console.error(e); }
}
function lockGudang() {
  const v = $('lock-outlet-select').value;
  if (!v) { toast('Pilih outlet dulu', 'warn'); return; }
  G.outlet = v;
  localStorage.setItem('mykitchen_gudang_outlet_id', v);
  const o = G.outlets.find(x => x.id === v);
  $('gudang-outlet-name').textContent = o ? o.name : v;
  $('gudang-user').textContent = (G.session.name || '') + ' • ' + (G.session.role || '');
  $('lock-screen').classList.add('hidden');
  $('main-screen').classList.remove('hidden');
  loadAll();
}
function unlockGudang() {
  if (!confirm('Ganti outlet?')) return;
  localStorage.removeItem('mykitchen_gudang_outlet_id');
  location.reload();
}
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
  $('tab-' + name).classList.remove('hidden');
  ({ po: loadPO, transfer: loadTransfers, pasar: loadPasar, prep: loadPreps, opname: loadOpnames, waste: loadWaste, riwayat: renderLogs, appr: loadApprovals, dash: renderDash, stok: renderStok })[name]?.();
}
async function loadAll() {
  await loadIngredients();
  renderDash(); renderStok();
  loadApprovals();
}
async function loadIngredients() {
  try {
    const r = await (await fetch('/api/owner/ingredients?outlet_id=' + G.outlet)).json();
    G.ingredients = (r.success && r.ingredients) || [];
    G.logs = (r.success && r.stockLogs) || [];
  } catch(e) {}
}

// ===== DASBOR =====
function renderDash() {
  const list = G.ingredients;
  $('dash-total').textContent = list.length;
  $('dash-value').textContent = rp(list.reduce((s, i) => s + (Number(i.valuation) || 0), 0));
  const low = list.filter(i => i.status === 'low'), out = list.filter(i => i.status === 'out_of_stock');
  $('dash-low').textContent = low.length;
  $('dash-out').textContent = out.length;
  const alerts = [...out.map(i => ({...i, lv: 2})), ...low.map(i => ({...i, lv: 1}))];
  $('dash-alerts').innerHTML = alerts.length ? alerts.map(i => `
    <div class="p-4 flex items-center gap-3">
      <div class="text-2xl">${i.lv === 2 ? '🚫' : '⚠️'}</div>
      <div class="flex-1"><div class="font-bold text-sm text-maroon">${esc(i.name)}</div>
      <div class="text-xs text-stone-500 font-mono">Sisa ${i.currentStock} ${esc(i.unit)} (min ${i.minStockAlert})</div></div>
      <button onclick="openRestock('${i.id}')" class="px-3 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-bold">Restock</button>
    </div>`).join('')
    : '<div class="p-8 text-center text-stone-400 text-sm">Semua stok aman 🎉</div>';
}

// ===== STOK =====
function renderStok() {
  const q = ($('stok-search').value || '').toLowerCase();
  const f = $('stok-filter').value;
  const list = G.ingredients.filter(i => {
    if (q && !(i.name || '').toLowerCase().includes(q)) return false;
    if (f === 'low' && i.status !== 'low') return false;
    if (f === 'out' && i.status !== 'out_of_stock') return false;
    if (['RAW_MATERIAL','PREP_ITEM','PACKAGING'].includes(f) && i.itemType !== f) return false;
    return true;
  });
  const typeBadge = t => t === 'PREP_ITEM' ? '<span class="ml-1 px-1.5 py-px rounded text-[9px] font-bold bg-purple-100 text-purple-700">OLAHAN</span>' : t === 'PACKAGING' ? '<span class="ml-1 px-1.5 py-px rounded text-[9px] font-bold bg-sky-100 text-sky-700">KEMASAN</span>' : '';
  $('stok-body').innerHTML = list.map(i => `
    <tr class="hover:bg-stone-50">
      <td class="py-3 px-4"><div class="font-bold text-maroon text-sm">${esc(i.name)}${typeBadge(i.itemType)}</div>
        <div class="text-[10px] text-stone-400">${rp(i.costPerUnit)}/${esc(i.unit)}</div></td>
      <td class="py-3 px-4 text-right font-mono font-bold ${i.status === 'out_of_stock' ? 'text-rose-600' : i.status === 'low' ? 'text-amber-600' : ''}">${i.currentStock} ${esc(i.unit)}</td>
      <td class="py-3 px-4 text-right font-mono text-xs">${rp(i.valuation)}</td>
      <td class="py-3 px-4"><div class="flex justify-center gap-1">
        <button onclick="openRestock('${i.id}')" class="px-2 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-bold">Restock</button>
        <button onclick="openWasteModal('${i.id}')" class="px-2 py-1 rounded-lg bg-amber-50 text-amber-700 border border-amber-200 text-[10px] font-bold">Waste</button>
      </div></td>
    </tr>`).join('') || '<tr><td colspan="4" class="py-8 text-center text-stone-400 text-sm">Tidak ada bahan</td></tr>';
}

// ===== MODAL helper =====
function openModal(html) {
  $('modal-wrap').innerHTML = `<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-maroon/80 backdrop-blur-sm" onclick="if(event.target===this)closeModal()"><div class="w-full max-w-lg bg-white rounded-3xl p-6 shadow-2xl max-h-[92vh] overflow-y-auto">${html}</div></div>`;
  lucide.createIcons();
}
function closeModal() { $('modal-wrap').innerHTML = ''; }
function modalHead(icon, title, sub) {
  return `<div class="flex items-center justify-between pb-3 border-b border-stone-100 mb-4">
    <div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-2xl bg-red-100 text-brand flex items-center justify-center text-xl">${icon}</div>
    <div><h4 class="text-sm font-extrabold text-maroon">${title}</h4><span class="text-[10px] text-stone-400">${sub}</span></div></div>
    <button onclick="closeModal()" class="p-1 rounded-full text-stone-400 hover:text-stone-700 text-xl">×</button></div>`;
}
function ingOptions(sel) {
  return G.ingredients.map(i => `<option value="${i.id}" ${i.id === sel ? 'selected' : ''}>${esc(i.name)} (${i.currentStock} ${esc(i.unit)})</option>`).join('');
}

// ===== RESTOCK =====
function openRestock(ingId) {
  const ing = G.ingredients.find(i => i.id === ingId);
  if (!ing) return;
  openModal(modalHead('📥', 'Restock — ' + esc(ing.name), `Stok sekarang: ${ing.currentStock} ${esc(ing.unit)}`) + `
    <form onsubmit="submitRestock(event,'${ing.id}')" class="space-y-3 text-sm">
      <div><label class="font-bold text-xs">Jumlah Masuk (${esc(ing.unit)})</label>
        <input id="rs-qty" type="number" step="any" min="0.001" required class="w-full px-3 py-2 rounded-xl border border-stone-300 font-mono font-bold focus:border-brand focus:outline-none"></div>
      <div><label class="font-bold text-xs">Harga Beli / ${esc(ing.unit)} (Rp) — untuk HPP rata-rata</label>
        <input id="rs-cost" type="number" min="0" placeholder="${ing.costPerUnit}" class="w-full px-3 py-2 rounded-xl border border-stone-300 font-mono focus:border-brand focus:outline-none"></div>
      <div><label class="font-bold text-xs">Supplier</label>
        <input id="rs-sup" type="text" value="${esc(ing.supplier || '')}" class="w-full px-3 py-2 rounded-xl border border-stone-300 focus:border-brand focus:outline-none"></div>
      <button class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm">Simpan Restock</button>
    </form>`);
}

        <div class="flex-1"><div class="font-extrabold text-maroon text-sm">${esc(p.ingredient_name || '-')} <span class="font-mono">${p.qty} ${esc(p.unit || '')}</span></div>
        <div class="text-xs text-stone-500">${rp(a.totalCost)} • oleh ${esc(a.requestedBy)} • ${fmtDate(a.requestedAt)}</div>
        ${p.note ? `<div class="text-[11px] text-stone-400 italic">${esc(p.note)}</div>` : ''}</div>
        <div class="flex gap-2"><button onclick="decideAppr('${a.id}','approve')" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">Setujui</button>
        <button onclick="decideAppr('${a.id}','reject')" class="px-4 py-2 rounded-xl bg-stone-100 text-stone-600 text-xs font-extrabold">Tolak</button></div>
      </div>`;
    }).join('')
    : '<div class="bg-white rounded-3xl border p-8 text-center text-stone-400 text-sm">Tidak ada pengajuan menunggu.</div>';
  } catch(e) {}
}
async function decideAppr(id, decision) {
  if (!confirm(decision === 'approve' ? 'Setujui? Stok akan bertambah.' : 'Tolak pengajuan?')) return;
  const r = await (await fetch('/api/owner/approvals/decide', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id, decision }) })).json();
  if (r.success) { toast(r.message || 'Berhasil', 'ok'); loadApprovals(); loadIngredients().then(renderDash); }
  else toast(r.message || 'Gagal', 'error');
}

document.addEventListener('DOMContentLoaded', init);
lucide.createIcons();
</script>
</body>
